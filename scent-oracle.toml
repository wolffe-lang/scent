# scent's behavioral pin. Prior art: boreutils 12de639f gnu-oracle.toml,
# B44 (one oracle, no drifting verdict) and B73 (version alone is not
# identity). This pins source, configure, base image, libc and environment.
# The GNU tree is built by tools only, never read or used as design input.
# 2026-10-23: tarball hashed twice, detached signature verified against
# the separately digested GNU keyring; VALIDSIG fingerprint below.
# 2026-11-01 (r41p, R-r41p-3 A): GNU replaced gnu-keyring.gpg, so its digest
# is re-pinned (read twice on hasu and on the Mac). The new file still yields
# VALIDSIG at the pinned fingerprint, and the oracle built from it matches the
# pinned binary_sha256; the fingerprint and the binary digest are unchanged.
[oracle]
version = "3.12"
version_line = "grep (GNU grep) 3.12"
url = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
sig_url = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz.sig"
keyring_url = "https://ftp.gnu.org/gnu/gnu-keyring.gpg"
keyring_sha256 = "8013de59880f7a59f53b6bd207f4d2a408d67b84a82fa9cba1dbbf443428e2db"
signing_fingerprint = "155D3FC500C834486D1EEA677FD9FCCB000BEEEE"
configure_args = "--disable-perl-regexp"
image = "docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55"
glibc_line = "ldd (Ubuntu GLIBC 2.39-0ubuntu8.9) 2.39"
# Observation at /work/build, GCC from the image on the measurement date.
binary_sha256 = "92b211f7a6422d621d4ab1330739b3dbe520283c5e628b848f36f8c29b9be7ea"
perl_refusal = "grep: Perl matching not supported in a --disable-perl-regexp build"
perl_status = 2

[oracle.env]
LC_ALL = "C"
