# Shape: aspen 476edee3 .github/workflows/ci.yml; one behavioral oracle.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [trunk]
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'job ids, space-separated; empty selects all'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.head_ref, contains(github.event.pull_request.labels.*.name, 'full-matrix') && 'full' || 'pr') || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IN_JOBS: ${{ inputs.jobs }}
        run: python3 -I ci/tiers.py plan --merge --github-output "$GITHUB_OUTPUT"
  plan-test:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'plan-test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I ci/tiers-test.py
      - run: python3 -I tools/re-ci-test
  linux:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCENT_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - name: Cache digest-pinned oracle and toolchain
        uses: actions/cache@v4
        with:
          path: |
            .wolf-bin
            .oracle
          key: scent-linux-${{ hashFiles('wolf-toolchain.toml', 'scent-oracle.toml', 'ci/oracle.Containerfile', 'tools/fetch-oracle.py') }}
      - name: Build own pinned Ubuntu container
        run: docker build -t localhost/scent-oracle -f ci/oracle.Containerfile ci
      - name: Stage digest-pinned toolchain and oracle
        run: tools/in-container bash -c 'tools/fetch-toolchain && tools/fetch-oracle'
      - name: Format and both compiler tiers
        run: tools/in-container bash -c 'tools/check-fmt && tools/build --all'
      - name: Checked tests with explicit native-fallback reruns, native and lupin
        if: ${{ !cancelled() }}
        run: tools/in-container tools/check-test
      - name: Exact-name and explicit-glob oracle selection
        if: ${{ !cancelled() }}
        run: tools/in-container tools/oracle-select-test
      - name: GNU oracle, native
        if: ${{ !cancelled() }}
        run: tools/in-container tools/oracle --bin target/native/scent
      - name: GNU oracle, release
        if: ${{ !cancelled() }}
        run: tools/in-container tools/oracle --bin target/release/scent
      - name: Regex engine units, malformed patterns, gate corpus and costs
        if: ${{ !cancelled() }}
        run: tools/in-container tools/re-ci
      - name: Static build twice and digest
        if: ${{ !cancelled() }}
        run: tools/in-container tools/mkscent target/mkscent
      - name: GNU oracle, static
        if: ${{ !cancelled() }}
        run: tools/in-container tools/oracle --bin target/mkscent/scent
      - name: Streaming memory gate and recorded performance
        if: ${{ !cancelled() }}
        run: tools/in-container tools/measure
      - name: Retain byte diffs and measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-evidence
          path: |
            target/oracle
            target/measure.json
            target/mkscent/sums.txt
            target/tests
            target/re
  macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'macos')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch-toolchain
      - run: tools/build --all
      - run: tools/check-test
      - name: Distribution field leg (never the behavioral gate)
        run: |
          brew install grep
          ggrep --version
          tools/oracle --field --bin target/release/scent
  tier:
    name: tier ${{ needs.plan.outputs.tier || 'unplanned' }}
    if: ${{ !cancelled() }}
    needs:
      - plan
      - plan-test
      - linux
      - macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I ci/tiers.py verdict
  nightly-red:
    needs: tier
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/nightly-red.sh
